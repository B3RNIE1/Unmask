<title>UNMASK — Daily Word Puzzle</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #121213;
    --tile-bg: #F4F4F5;
    --tile-border: #D4D4D8;
    --correct: #6AAA64;
    --incorrect: #787C7E;
    --card-bg: #ffffff;
    --panel-soft: #f4f4f5;
    --btn-bg: #121213;
    --btn-fg: #ffffff;
    --input-border: #d4d4d8;
    --muted: #71717a;
    --shadow: 0 8px 30px rgba(0,0,0,0.08);
    --status-err-bg: #fee2e2;
    --status-err-fg: #b91c1c;
    --status-ok-bg: #dcfce7;
    --status-ok-fg: #166534;
    --key-bg: #D4D4D8;
  }

  body.dark {
    --bg: #121213;
    --fg: #ffffff;
    --tile-bg: #1a1a1c;
    --tile-border: #3a3a3c;
    --correct: #538d4e;
    --incorrect: #3a3a3c;
    --card-bg: #18181b;
    --panel-soft: #1f1f23;
    --btn-bg: #ffffff;
    --btn-fg: #121213;
    --input-border: #3a3a3c;
    --shadow: 0 8px 30px rgba(0,0,0,0.5);
    --status-err-bg: #4c1d1d;
    --status-err-fg: #fecaca;
    --status-ok-bg: #14532d;
    --status-ok-fg: #bbf7d0;
    --key-bg: #818384;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .app {
    width: 100%;
    max-width: 480px;
    padding: 16px 16px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------------- Header ---------------- */
  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 4px 14px;
    border-bottom: 1px solid var(--input-border);
    margin-bottom: 22px;
  }

  .title {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 6px;
    text-transform: uppercase;
    user-select: none;
  }

  .toggle {
    position: relative;
    width: 60px;
    height: 32px;
    background: var(--panel-soft);
    border: 1.5px solid var(--input-border);
    border-radius: 999px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  .toggle .thumb {
    position: absolute;
    top: 2px;
    left: 3px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--btn-bg);
    color: var(--btn-fg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    line-height: 1;
    transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease;
    pointer-events: none;
  }
  .toggle .thumb::after { content: "☀"; }
  body.dark .toggle .thumb { transform: translateX(28px); }
  body.dark .toggle .thumb::after { content: "☾"; }

  /* ---------------- Sections ---------------- */
  section { width: 100%; text-align: center; }

  .section-label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted, #71717a);
    margin-bottom: 10px;
    font-weight: 600;
  }
  body.dark .section-label { color: #a1a1aa; }

  .topsecret {
    background: var(--card-bg);
    border: 1px solid var(--input-border);
    border-radius: 16px;
    padding: 20px 14px;
    box-shadow: var(--shadow);
    margin-bottom: 26px;
  }
  /* Lock target tiles on a single row — they never wrap or snap downward. */
  #targetDisplay {
    display: flex;
    justify-content: center;
    gap: 5px;
    flex-wrap: nowrap;
  }

  .target-letter {
    width: 32px;
    height: 32px;
    font-size: 1.2rem;
    border: 2px solid var(--tile-border);
    background: var(--tile-bg);
    color: var(--fg);
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
    border-radius: 8px;
    user-select: none;
    transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease, transform 0.3s ease;
  }
  .target-letter.revealed {
    background: var(--correct);
    border-color: var(--correct);
    color: #ffffff;
    animation: flip 0.5s ease;
  }
  @keyframes flip {
    0% { transform: rotateX(0deg); }
    50% { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }

  /* ---------------- Grid ---------------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 62px);
    gap: 8px;
    justify-content: center;
    margin: 0 auto 24px;
  }
  .cell {
    width: 62px;
    height: 62px;
    border: 2px solid var(--tile-border);
    background: var(--tile-bg);
    color: var(--fg);
    font-size: 30px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
    border-radius: 8px;
    transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease, transform 0.3s ease;
  }
  .cell.filled { border-color: var(--fg); }
  .cell.active { border-color: var(--correct); }
  .cell.green {
    background: var(--correct);
    border-color: var(--correct);
    color: #ffffff;
    animation: pop 0.3s ease;
  }
  .cell.grey {
    background: var(--incorrect);
    border-color: var(--incorrect);
    color: #ffffff;
    animation: pop 0.3s ease;
  }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .shaking { animation: shake 0.4s ease; }

  /* ---------------- Controls ---------------- */
  .controls {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--input-border);
    border-radius: 16px;
    padding: 18px 14px;
    box-shadow: var(--shadow);
  }

  .input-row { display: flex; gap: 10px; margin-bottom: 14px; }
  #guessInput {
    flex: 1;
    min-width: 0;
    height: 54px;
    border: 2px solid var(--input-border);
    border-radius: 10px;
    background: var(--tile-bg);
    color: var(--fg);
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 4px;
    text-transform: uppercase;
    outline: none;
    transition: border-color 0.3s ease, background 0.3s ease, color 0.3s ease;
  }
  #guessInput:focus { border-color: var(--correct); }
  #guessInput:disabled { opacity: 0.5; }

  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-family: inherit;
    transition: transform 0.1s ease, background 0.3s ease, color 0.3s ease, opacity 0.3s ease;
  }
  button:active { transform: scale(0.96); }
  #submitBtn {
    height: 54px;
    padding: 0 18px;
    background: var(--btn-bg);
    color: var(--btn-fg);
    font-size: 16px;
    white-space: nowrap;
  }
  #submitBtn:disabled { opacity: 0.4; cursor: not-allowed; }

  #shareBtn {
    display: none;
    width: 100%;
    height: 52px;
    background: var(--correct);
    color: #ffffff;
    font-size: 17px;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  #status {
    min-height: 20px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--muted, #71717a);
    transition: background 0.3s ease, color 0.3s ease;
  }
  body.dark #status { color: #a1a1aa; }
  #status.error { background: var(--status-err-bg); color: var(--status-err-fg); }
  #status.ok { background: var(--status-ok-bg); color: var(--status-ok-fg); }

  #meta {
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted, #71717a);
    text-align: center;
  }
  body.dark #meta { color: #a1a1aa; }

  /* ---------------- QWERTY keyboard ---------------- */
  .keyboard {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    margin-top: 22px;
  }
  .kb-row { display: flex; gap: 5px; justify-content: center; }
  .kb-key {
    width: 42px;
    height: 50px;
    background: var(--key-bg);
    color: var(--fg);
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: default;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    transition: background 0.3s ease, color 0.3s ease, opacity 0.3s ease;
  }
  .kb-key.green { background: var(--correct); color: #ffffff; }
  .kb-key.burned { background: var(--incorrect); color: #ffffff; opacity: 0.85; }

  @media (max-width: 420px) {
    .grid { grid-template-columns: repeat(5, 54px); gap: 6px; }
    .cell { width: 54px; height: 54px; font-size: 26px; }
    .title { font-size: 26px; letter-spacing: 5px; }
    .kb-row { gap: 3px; }
    .kb-key { width: 32px; height: 40px; font-size: 12px; }
  }
</style>

  /* ================= Theme ================= */
  var toggleBtn = document.getElementById("themeToggle");
  function applyTheme(dark) {
    document.body.classList.toggle("dark", dark);
    localStorage.setItem("unmask-theme", dark ? "dark" : "light");
  }
  applyTheme(localStorage.getItem("unmask-theme") === "dark");
  toggleBtn.addEventListener("click", function () {
    applyTheme(!document.body.classList.contains("dark"));
  });

  /* ================= Word Bank ================= */
  var WORD_BANK = [
    "BASKETBALL","CALCULATOR","CHIMPANZEE","CONFIDENCE","DEFINITION",
    "EVERYTHING","FRIENDSHIP","HELICOPTER","IMPOSSIBLE","MOTORCYCLE",
    "RAINFOREST","RESTAURANT","SIMULATION","TECHNOLOGY","TOOTHPASTE",
    "UNIVERSITY","VEGETABLES","ACHIEVEMENT","ADVERTISING","AGRICULTURE",
    "ANNIVERSARY","CATERPILLAR","CELEBRATION","COMMUNICATE","COMPLICATED",
    "DESTINATION","ELECTRICITY","ENVIRONMENT","EXTERMINATE","IMAGINATION",
    "INDEPENDENT","INFORMATION","INTELLIGENT","MARSHMALLOW","MATHEMATICS",
    "PERSONALITY","PHOTOGRAPHY","RESPONSIBLE","SPECTACULAR","TEMPERATURE",
    "ACCELERATION","ARCHITECTURE","BIODIVERSITY","CHAMPIONSHIP","CIVILIZATION",
    "CONSEQUENCES","INTRODUCTION","KINDERGARTEN","RELATIONSHIP","THUNDERSTORM"
  ];

  /* ================= Daily word selection ================= */
  function getDayIndex() {
    var now = new Date();
    var utc = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor(utc / 86400000);
  }
  var dayIndex = getDayIndex();
  var secret = WORD_BANK[((dayIndex % 50) + 50) % 50];

  /* ================= State ================= */
  var GRID = 5;
  var MAX_TRIES = 5;
  var activeRow = 0;
  var gameOver = false;
  var submitDisabled = false;
  var revealed = [];       // boolean per target tile
  var rows = [];           // letters per row
  var rowResults = [];     // per row: array of true(green)/false(grey)

  /* ================= DOM refs ================= */
  var targetRowEl = document.getElementById("targetDisplay");
  var gridEl = document.getElementById("grid");
  var inputEl = document.getElementById("guessInput");
  var submitBtn = document.getElementById("submitBtn");
  var shareBtn = document.getElementById("shareBtn");
  var statusEl = document.getElementById("status");
  var dayEl = document.getElementById("day");
  var triesEl = document.getElementById("tries");

  /* ================= Build UI ================= */
  var targetTiles = [];
  for (var i = 0; i < secret.length; i++) {
    revealed.push(false);
    var t = document.createElement("div");
    t.className = "target-letter";
    targetRowEl.appendChild(t);
    targetTiles.push(t);
  }

  var cells = [];
  for (var r = 0; r < MAX_TRIES; r++) {
    rows.push([]);
    rowResults.push(null);
    for (var c = 0; c < GRID; c++) {
      var cell = document.createElement("div");
      cell.className = "cell";
      cell.setAttribute("data-r", r);
      cell.setAttribute("data-c", c);
      gridEl.appendChild(cell);
      cells.push({ el: cell, r: r, c: c });
    }
  }

  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var now = new Date();
  dayEl.textContent = months[now.getMonth()] + " " + now.getDate() + ", " + now.getFullYear();
  triesEl.textContent = "Tries left: " + (MAX_TRIES - activeRow);

  /* ================= QWERTY keyboard ================= */
  var KEY_ROWS = [
    ["Q","W","E","R","T","Y","U","I","O","P"],
    ["A","S","D","F","G","H","J","K","L"],
    ["Z","X","C","V","B","N","M"]
  ];
  var keyMap = {}; // letter -> key button element
  function buildKeyboard() {
    var kb = document.getElementById("keyboard");
    KEY_ROWS.forEach(function (row) {
      var rowEl = document.createElement("div");
      rowEl.className = "kb-row";
      row.forEach(function (ch) {
        var k = document.createElement("button");
        k.type = "button";
        k.className = "kb-key";
        k.textContent = ch;
        k.dataset.letter = ch;
        rowEl.appendChild(k);
        keyMap[ch] = k;
      });
      kb.appendChild(rowEl);
    });
  }
  // Color feedback: green if the letter exists in the mystery word,
  // burned (dark grey) if guessed but not present.
  function updateKeyboard(letters) {
    for (var i = 0; i < letters.length; i++) {
      var ch = letters[i];
      var k = keyMap[ch];
      if (!k) continue;
      if (secret.indexOf(ch) >= 0) {
        if (!k.classList.contains("green")) k.classList.add("green");
      } else if (!k.classList.contains("green")) {
        k.classList.add("burned");
      }
    }
  }
  buildKeyboard();

  function rowCells(r) {
    return cells.filter(function (c) { return c.r === r; });
  }

  function renderGrid() {
    for (var r = 0; r < MAX_TRIES; r++) {
      var rc = rowCells(r);
      for (var c = 0; c < GRID; c++) {
        var el = rc[c].el;
        var letter = (rows[r] && rows[r][c]) || "";
        el.textContent = letter;
        el.classList.remove("green", "grey", "filled", "active");
        if (rowResults[r]) {
          el.classList.add(rowResults[r][c] ? "green" : "grey");
        } else if (letter) {
          el.classList.add("filled");
          if (r === activeRow && !gameOver) el.classList.add("active");
        } else if (r === activeRow && !gameOver) {
          el.classList.add("active");
        }
      }
    }
  }

  /* ================= Mirror effect ================= */
  inputEl.addEventListener("input", function () {
    if (gameOver || submitDisabled) return;
    var val = inputEl.value.replace(/[^a-zA-Z]/g, "").toUpperCase().slice(0, 5);
    inputEl.value = val;
    for (var c = 0; c < GRID; c++) {
      rows[activeRow][c] = val[c] || "";
    }
    renderGrid();
  });

  /* ================= Local dictionary validation (zero latency) ================= */
  // No fetch, no network request. Instantly checks the guess against the
  // local validGuesses array after forcing it to uppercase.
  function isRealWord(word) {
    return validGuesses.indexOf(word) !== -1;
  }

  function shakeRow() {
    gridEl.classList.remove("shaking");
    void gridEl.offsetWidth; // reflow to restart animation
    gridEl.classList.add("shaking");
    setTimeout(function () { gridEl.classList.remove("shaking"); }, 400);
  }

  function showError(msg) {
    statusEl.textContent = msg;
    statusEl.className = "error";
  }
  function showInfo(msg) {
    statusEl.textContent = msg;
    statusEl.className = "";
  }
  function showOk(msg) {
    statusEl.textContent = msg;
    statusEl.className = "ok";
  }

  /* ================= Submit ================= */
  function submitGuess() {
    if (gameOver) return;

    var word = inputEl.value.trim().toUpperCase();
    if (word.length !== 5) {
      showError("Please enter a 5-letter word.");
      shakeRow();
      return;
    }

    // Instant local validation — no background web loading requests at all.
    if (!isRealWord(word)) {
      showError("Not a real word!");
      shakeRow();
      inputEl.value = "";
      renderGrid();
      return;
    }

    var letters = word.split("");
    var result = new Array(GRID).fill(false);
    var updates = []; // target tile indices newly revealed

    // Map each guess letter to an unrevealed matching position in the target
    for (var i = 0; i < letters.length; i++) {
      var ch = letters[i];
      var assigned = -1;
      for (var p = 0; p < secret.length; p++) {
        if (secret[p] === ch && !revealed[p]) { assigned = p; break; }
      }
      if (assigned >= 0) {
        revealed[assigned] = true;
        result[i] = true;
        updates.push(assigned);
      } else if (secret.indexOf(ch) >= 0) {
        // letter exists but all its positions already revealed -> still green
        result[i] = true;
      }
    }

    rowResults[activeRow] = result;
    rows[activeRow] = letters.slice();

    // update the on-screen keyboard (used-letter tracker)
    updateKeyboard(letters);

    // reveal top tiles (3D flip)
    updates.forEach(function (idx) {
      var t = targetTiles[idx];
      t.textContent = secret[idx];
      t.classList.add("revealed");
    });

    // animate guess tiles
    var rc = rowCells(activeRow);
    rc.forEach(function (c, i) {
      setTimeout(function () {
        c.el.classList.remove("active");
        c.el.classList.add(result[i] ? "green" : "grey");
      }, i * 60);
    });

    activeRow++;

    var allRevealed = revealed.every(function (v) { return v; });
    if (allRevealed) { endGame(true, activeRow); return; }
    if (activeRow >= MAX_TRIES) { endGame(false, MAX_TRIES); return; }

    triesEl.textContent = "Tries left: " + (MAX_TRIES - activeRow);
    inputEl.value = "";
    showInfo("Good guess! Try #" + activeRow + " of " + MAX_TRIES + ".");
    renderGrid();
  }

  function endGame(win, score) {
    gameOver = true;
    inputEl.disabled = true;
    submitBtn.style.display = "none";

    if (win) {
      showOk("🎉 You Unmasked the word completely!");
    } else {
      for (var i = 0; i < secret.length; i++) {
        if (!revealed[i]) {
          targetTiles[i].textContent = secret[i];
          targetTiles[i].classList.add("revealed");
        }
      }
      showError("Game Over! The word was " + secret + ".");
    }

    shareBtn.style.display = "block";
    triesEl.textContent = "Score: " + score + "/" + MAX_TRIES;
  }

  /* ================= Share ================= */
  shareBtn.addEventListener("click", function () {
    var lines = [];
    for (var r = 0; r < MAX_TRIES; r++) {
      var line = "";
      if (rowResults[r]) {
        for (var c = 0; c < GRID; c++) line += rowResults[r][c] ? "🟩" : "⬛";
      } else {
        line += "⬛⬛⬛⬛⬛";
      }
      lines.push(line);
    }
    var score = 0;
    for (var s = 0; s < MAX_TRIES; s++) if (rowResults[s]) score++;

    var shareText = "UNMASK · Day " + dayIndex + " · Score " + score + "/" + MAX_TRIES
      + "\n\n" + lines.join("\n") + "\n\nPlay: " + window.location.href;

    function doneCopy() { alert("Results copied to clipboard!"); }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareText).then(doneCopy).catch(function () {
        fallbackCopy(shareText, doneCopy);
      });
    } else {
      fallbackCopy(shareText, doneCopy);
    }
  });

  function fallbackCopy(text, onDone) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); onDone(); }
    catch (e) { alert("Could not copy. Results:\n\n" + text); }
    document.body.removeChild(ta);
  }

  /* ================= Events ================= */
  submitBtn.addEventListener("click", submitGuess);
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); submitGuess(); }
  });

  renderGrid();
  inputEl.focus();
})();
